<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Bucket List</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <!-- Banner -->
    <header class="banner">
        <img src="images/Travel-banner.jpg" alt="Banner">
    </header>

    <div class="container">

        <!-- LEFT -->

        <div class="left-card">

            <h2>
                <i class="fa-regular fa-compass"></i>
                Add New Destination
            </h2>

            <form id="travelForm">

                <label>Country</label>
                <input type="text" id="country" placeholder="Enter country" required>
                <label>City</label>
                <input type="text" id="city" placeholder="Enter city" required>
                <label>Reason to Visit</label>
                <textarea id="description" placeholder="Why do you want to visit this place?" required></textarea>

                <label>Visited?</label>
                <select id="verified">
                    <option value="false">
                        Not Visited
                    </option>
                    <option value="true">
                        Visite
                    </option>
                </select>

                <button type="submit" class="add-btn">
                    <i class="fa-solid fa-plane-departure"></i>
                    Add Destination
                </button>
            </form>
        </div>

        <!-- RIGHT -->
        <div class="right-card">
            <div class="top">
                <h2>
                    <i class="fa-solid fa-suitcase"></i>
                    Your Bucket List
                </h2>
                <div class="count" id="quantity">
                    0 Destinations
              </div>
            </div>
            <div id="destinationList">
                <!-- JavaScript inserts cards here -->
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
