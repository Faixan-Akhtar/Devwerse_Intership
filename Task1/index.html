<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Interactive Profile Card</title>
</head>
<body>
    <h1>Interactive Profile Card</h1>
    <div class="container">
        <div class="card">
            <img src="avatar_1.png" alt="avatar_1">
           
            <h2 class="name">Katherine Lee</h2>
            <p class="role">Web Developer</p>

            <button class="greetBtn">Greet Me</button>

            <p id="message1" class="message"></p>
            <p class="count">Clicked 0 times</p>
        </div>
        
        <div class="card">
            <img src="avatar_2.png" alt="avatar_2">

            <h2 class="name">Brain Smith</h2>
            <p class="role">Graphic Designer</p>

            <button class="greetBtn">Greet Me</button>

            <p id="message2" class="message"></p>
            <p class="count">Clicked 0 times</p>
        </div>

        <div class="card">
            <img src="avatar_3.png" alt="avatar_3">

            <h2 class="name">Alice Johnson</h2>
            <p class="role">Software Engineer</p>

            <button class="greetBtn">Greet Me</button>

            <p id="message3" class="message"></p>
            <p class="count">Clicked 0 times</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
